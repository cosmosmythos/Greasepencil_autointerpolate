version: 2.1

# Define reusable commands
commands:
  setup_python:
    steps:
      - run:
          name: Setup Python (Linux)
          command: |
            python --version
            python -m pip install --upgrade pip
            pip install setuptools wheel build

jobs:
  # Build Interpolate Modules
  build_interpolate_windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install dependencies (Windows)
          shell: powershell.exe
          command: |
            choco install cmake visualstudio2022buildtools eigen -y
            # Pin Python exactly like GitHub Actions
            choco install python --version=3.11.9 -y --force
            py -3.11 --version
            & "C:\Program Files\CMake\bin\cmake.exe" --version
      - run:
          name: Install Python build deps (Windows)
          shell: powershell.exe
          command: |
            py -3.11 -m pip install --upgrade pip
            py -3.11 -m pip install setuptools wheel build
      - run:
          name: Build C++ extension (Windows)
          shell: powershell.exe
          command: |
            # Get Python 3.11 executable path
            $PythonExe = py -3.11 -c "import sys; print(sys.executable)"
            Write-Host "Using Python: $PythonExe"
            
            New-Item -ItemType Directory -Force -Path Executable\build | Out-Null
            Set-Location Executable\build
            & "C:\Program Files\CMake\bin\cmake.exe" .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$PythonExe"
            & "C:\Program Files\CMake\bin\cmake.exe" --build . --config Release
            Set-Location ../..
      - run:
          name: Build wheel (Windows)
          shell: powershell.exe
          command: |
            py -3.11 setup.py bdist_wheel
      - store_artifacts:
          path: dist/*.whl
      - persist_to_workspace:
          root: .
          paths:
            - dist/*.whl

  build_interpolate_linux:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake build-essential libeigen3-dev
      - setup_python
      - run:
          name: Build C++ extension
          command: |
            mkdir -p Executable/build
            cd Executable/build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release
            cd ../..
      - run:
          name: Build wheel
          command: |
            python setup.py bdist_wheel
      - store_artifacts:
          path: dist/*.whl
      - persist_to_workspace:
          root: .
          paths:
            - dist/*.whl

  # Build LineVector Module
  build_linevector_windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    steps:
      - checkout
      - run:
          name: Install dependencies (Windows)
          shell: powershell.exe
          command: |
            choco install cmake visualstudio2022buildtools -y
            # Pin Python exactly like GitHub Actions
            choco install python --version=3.11.9 -y --force
            # Match GitHub Actions: opencv + eigen + boost-msvc-14.3
            choco install opencv eigen boost-msvc-14.3 -y
            py -3.11 --version
            & "C:\Program Files\CMake\bin\cmake.exe" --version
      - run:
          name: Install Python build deps (Windows)
          shell: powershell.exe
          command: |
            py -3.11 -m pip install --upgrade pip
            py -3.11 -m pip install setuptools wheel build
      - run:
          name: Ensure simple_svg header exists
          shell: powershell.exe
          command: |
            $outFile = "Vectorize/src_polyvector/simple_svg_1.0.0.hpp"
            if (Test-Path $outFile) {
              Write-Host "Header already present: $outFile"
            } else {
              Write-Host "Downloading missing header to: $outFile"
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/adishavit/simple-svg/master/simple_svg_1.0.0.hpp" -OutFile $outFile
            }
      - run:
          name: Configure & build C++ extension (Windows)
          shell: powershell.exe
          command: |
            $ErrorActionPreference = "Stop"
            New-Item -ItemType Directory -Force -Path Vectorize\build | Out-Null
            Set-Location Vectorize\build
            
            Write-Host "=== Running CMake Configure ===" -ForegroundColor Cyan
            # Get Python 3.11 executable path
            $PythonExe = py -3.11 -c "import sys; print(sys.executable)"
            Write-Host "Using Python: $PythonExe"
            
            # Match GitHub Actions OpenCV_DIR and explicitly set Python paths
            & "C:\Program Files\CMake\bin\cmake.exe" .. -G "Visual Studio 17 2022" -A x64 -DOpenCV_DIR="C:/tools/opencv/build" -DPython3_EXECUTABLE="$PythonExe"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CMake configuration failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            
            Write-Host "=== Running CMake Build ===" -ForegroundColor Cyan
            & "C:\Program Files\CMake\bin\cmake.exe" --build . --config Release --verbose
            if ($LASTEXITCODE -ne 0) {
              Write-Error "CMake build failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            
            Write-Host "=== Build completed successfully ===" -ForegroundColor Green
            Set-Location ..\..
      - run:
          name: Verify binary location (Windows)
          shell: powershell.exe
          command: |
            Write-Host "Searching for gp_linevector.pyd in Vectorize directory:"
            Get-ChildItem -Path Vectorize -Recurse -Filter "*.pyd" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
            }
            
            Write-Host "`nSearching for any .dll files (dependencies):"
            Get-ChildItem -Path Vectorize -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
            }
            
            Write-Host "`nContents of Vectorize/output directory:"
            if (Test-Path "Vectorize\output") {
              Get-ChildItem -Path "Vectorize\output" -Recurse | ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
            } else {
              Write-Host "  (directory does not exist)"
            }
            
            Write-Host "`nContents of Vectorize/build/Release directory:"
            if (Test-Path "Vectorize\build\Release") {
              Get-ChildItem -Path "Vectorize\build\Release" -Recurse | ForEach-Object {
                Write-Host "  $($_.FullName)"
              }
            } else {
              Write-Host "  (directory does not exist)"
            }
      - run:
          name: Build wheel (Windows)
          shell: powershell.exe
          command: |
            py -3.11 setup_vectorize.py bdist_wheel
      - run:
          name: Bundle dependencies (Windows)
          shell: powershell.exe
          command: |
            py -3.11 -m pip install delvewheel
            Set-Location dist
            Get-ChildItem -Filter *.whl | ForEach-Object {
              Write-Host "Repairing wheel: $($_.Name)"
              py -3.11 -m delvewheel repair $_.Name -w . --add-path "C:/tools/opencv/build/x64/vc16/bin"
            }
            Set-Location ..
      - store_artifacts:
          path: dist/*.whl
      - persist_to_workspace:
          root: .
          paths:
            - dist/*.whl

  build_linevector_linux:
    docker:
      - image: cimg/python:3.11.9
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake libopencv-dev libeigen3-dev libboost-dev curl patchelf
      - setup_python
      - run:
          name: Download missing headers
          command: |
            curl -fsSL -o Vectorize/src_polyvector/simple_svg_1.0.0.hpp https://raw.githubusercontent.com/adishavit/simple-svg/master/simple_svg_1.0.0.hpp
      - run:
          name: Build C++ extension
          command: |
            mkdir -p Vectorize/build
            cd Vectorize/build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release
            cd ../..
      - run:
          name: Build wheel
          command: |
            python setup_vectorize.py bdist_wheel
      - run:
          name: Bundle dependencies
          command: |
            pip install auditwheel
            cd dist
            for wheel in *.whl; do
              auditwheel repair "$wheel" -w .
            done
      - store_artifacts:
          path: dist/*.whl
      - persist_to_workspace:
          root: .
          paths:
            - dist/*.whl

  # Package Everything
  package:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install zip
          command: sudo apt-get update && sudo apt-get install -y zip
      - run:
          name: Create platform-specific packages (Windows + Linux)
          command: |
            set -e
            
            # Collect all wheels into wheels-temp
            rm -rf wheels-temp
            mkdir -p wheels-temp
            find . -path "*/dist/*.whl" -exec cp {} wheels-temp/ \;
            echo "Collected wheels:"
            ls -la wheels-temp
            
            # Windows package
            echo "Creating Windows package..."
            mkdir -p build_windows/Addon
            cp -r Addon/* build_windows/Addon/
            rm -rf build_windows/Addon/wheels
            mkdir -p build_windows/Addon/wheels
            find wheels-temp -name "*win_amd64.whl" -exec cp {} build_windows/Addon/wheels/ \;
            
            WIN_INTERP=$(ls build_windows/Addon/wheels/*autointerpolate*win_amd64.whl 2>/dev/null | head -n 1)
            WIN_LINE=$(ls build_windows/Addon/wheels/*linevector*win_amd64.whl 2>/dev/null | head -n 1)
            
            if [ -z "$WIN_INTERP" ] || [ -z "$WIN_LINE" ]; then
              echo "❌ Missing required Windows wheels"; ls -la build_windows/Addon/wheels; exit 1;
            fi
            
            WIN_INTERP_BN=$(basename "$WIN_INTERP")
            WIN_LINE_BN=$(basename "$WIN_LINE")
            
            printf '\n# BEGIN GENERATED CONTENT.\n[build.generated]\nplatforms = ["windows-x64"]\nwheels = [\n  "./wheels/%s",\n  "./wheels/%s"\n]\n# END GENERATED CONTENT.\n' "$WIN_INTERP_BN" "$WIN_LINE_BN" >> build_windows/Addon/blender_manifest.toml
            cd build_windows/Addon
            WIN_ZIP_VER=$(echo "$WIN_INTERP_BN" | sed -n 's/^gp_autointerpolate-\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
            if [ -z "$WIN_ZIP_VER" ]; then WIN_ZIP_VER="unknown"; fi
            zip -r ../../gp_auto_interpolate-${WIN_ZIP_VER}-windows-x64.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store"
            cd ../..
            
            # Linux package
            echo "Creating Linux package..."
            mkdir -p build_linux/Addon
            cp -r Addon/* build_linux/Addon/
            rm -rf build_linux/Addon/wheels
            mkdir -p build_linux/Addon/wheels
            find wheels-temp -name "*linux_x86_64.whl" -exec cp {} build_linux/Addon/wheels/ \; || true
            find wheels-temp -name "*manylinux*.whl" -exec cp {} build_linux/Addon/wheels/ \; || true
            
            LINUX_INTERP=$(ls build_linux/Addon/wheels/*autointerpolate*linux_x86_64.whl 2>/dev/null | head -n 1)
            if [ -z "$LINUX_INTERP" ]; then
              LINUX_INTERP=$(ls build_linux/Addon/wheels/*autointerpolate*manylinux*.whl 2>/dev/null | head -n 1)
            fi
            LINUX_LINE=$(ls build_linux/Addon/wheels/*linevector*manylinux*.whl 2>/dev/null | head -n 1)
            
            if [ -z "$LINUX_INTERP" ] || [ -z "$LINUX_LINE" ]; then
              echo "❌ Missing required Linux wheels"; ls -la build_linux/Addon/wheels; exit 1;
            fi
            
            LINUX_INTERP_BN=$(basename "$LINUX_INTERP")
            LINUX_LINE_BN=$(basename "$LINUX_LINE")
            
            printf '\n# BEGIN GENERATED CONTENT.\n[build.generated]\nplatforms = ["linux-x64"]\nwheels = [\n  "./wheels/%s",\n  "./wheels/%s"\n]\n# END GENERATED CONTENT.\n' "$LINUX_INTERP_BN" "$LINUX_LINE_BN" >> build_linux/Addon/blender_manifest.toml
            cd build_linux/Addon
            LINUX_ZIP_VER=$(echo "$LINUX_INTERP_BN" | sed -n 's/^gp_autointerpolate-\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
            if [ -z "$LINUX_ZIP_VER" ]; then LINUX_ZIP_VER="unknown"; fi
            zip -r ../../gp_auto_interpolate-${LINUX_ZIP_VER}-linux-x64.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store"
            cd ../..
            
            echo "✅ Packages created:"
            ls -lh gp_auto_interpolate-*.zip
            
            rm -rf out_zips
            mkdir -p out_zips
            mv gp_auto_interpolate-*.zip out_zips/
            ls -lh out_zips
      - store_artifacts:
          path: out_zips

workflows:
  build_and_package:
    jobs:
      - build_interpolate_windows
      - build_interpolate_linux
      - build_linevector_windows
      - build_linevector_linux
      - package:
          requires:
            - build_interpolate_windows
            - build_interpolate_linux
            - build_linevector_windows
            - build_linevector_linux