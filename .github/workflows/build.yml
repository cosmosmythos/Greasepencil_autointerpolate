name: Build and Release Wheels

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # GP_AUTOINTERPOLATE — standard (cp311) + abi3 (cp312-abi3)
  # ============================================================================
  build_interpolate:
    name: "Interpolate ${{ matrix.build_type }} - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Standard builds — Python 3.11, non-abi3 (Blender 4.3)
          - os: windows-latest
            python-version: '3.11.9'
            build_type: standard
            platform: windows-x64
            wheel_platform: win_amd64
            cmake_abi3: ""
            enable_abi3: "0"
          - os: macos-latest
            python-version: '3.11.9'
            build_type: standard
            platform: macos-universal
            wheel_platform: macosx_11_0_universal2
            cmake_abi3: ""
            enable_abi3: "0"
          - os: ubuntu-latest
            python-version: '3.11.9'
            build_type: standard
            platform: linux-x64
            wheel_platform: manylinux_2_34_x86_64
            cmake_abi3: ""
            enable_abi3: "0"
          # abi3 builds — Python 3.12, stable ABI (covers Blender 4.4+, 5.x+)
          - os: windows-latest
            python-version: '3.12'
            build_type: abi3
            platform: windows-x64
            wheel_platform: win_amd64
            cmake_abi3: "-DENABLE_ABI3=ON"
            enable_abi3: "1"
          - os: macos-latest
            python-version: '3.12'
            build_type: abi3
            platform: macos-universal
            wheel_platform: macosx_11_0_universal2
            cmake_abi3: "-DENABLE_ABI3=ON"
            enable_abi3: "1"
          - os: ubuntu-latest
            python-version: '3.12'
            build_type: abi3
            platform: linux-x64
            wheel_platform: manylinux_2_34_x86_64
            cmake_abi3: "-DENABLE_ABI3=ON"
            enable_abi3: "1"

    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools build ninja

      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Eigen3 (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o eigen.tar.gz https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar xzf eigen.tar.gz
          echo "EIGEN3_ROOT=$PWD/eigen-3.4.0" >> $GITHUB_ENV
          echo "Eigen3 downloaded to $PWD/eigen-3.4.0"
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libomp-dev libeigen3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp eigen

      # ============================================================================
      # BUILD INTERPOLATE MODULE
      # ============================================================================
      - name: Configure CMake - Interpolate
        run: |
          mkdir -p Executable/build
          cd Executable/build
          python -c "import sys; print(f'Using Python: {sys.version}')"
          EIGEN_FLAGS=""
          if [ -n "$EIGEN3_ROOT" ]; then
            EIGEN_FLAGS="-DCMAKE_PREFIX_PATH=$EIGEN3_ROOT"
          fi
          cmake .. -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_abi3 }} $EIGEN_FLAGS
        shell: bash

      - name: Build C++ module - Interpolate
        run: |
          cd Executable/build
          cmake --build . --config Release --verbose
          echo "=== Interpolate build completed ==="
          find . -name "*.pyd" -o -name "*.so" || echo "No extensions found"
        shell: bash

      # Note: gp_linevector (Vectorize) is built by build_polyvector.yml workflow
      # (requires OpenCV, Eigen3, Boost dependencies - separate workflow)

      # ============================================================================
      # TEST IMPORTS
      # ============================================================================
      - name: Test extension imports
        run: |
          python -c "
          import sys
          import os
          import glob
          
          print('Testing extension imports...')
          
          # Test interpolate only (gp_linevector tested in separate workflow)
          if sys.platform == 'win32':
              ext1 = glob.glob('Executable/**/gp_autointerpolate.pyd', recursive=True)
          else:
              ext1 = glob.glob('Executable/**/gp_autointerpolate.so', recursive=True)
          
          if ext1:
              sys.path.insert(0, os.path.dirname(ext1[0]))
              import gp_autointerpolate
              print('[OK] gp_autointerpolate loaded successfully')
          else:
              print('[FAIL] gp_autointerpolate not found')
              sys.exit(1)
          "

      # ============================================================================
      # BUILD WHEELS
      # ============================================================================
      - name: Build wheel - Interpolate
        run: |
          ENABLE_ABI3=${{ matrix.enable_abi3 }} python -m build --wheel

      # Note: gp_linevector is built by build_polyvector.yml
      # (requires OpenCV, Eigen3, Boost - separate workflow)



      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-interpolate-${{ matrix.platform }}-${{ matrix.build_type }}
          path: dist/*.whl

  build_linevector:
    name: Build LineVector - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11.9', '3.13.9']
        include:
          - os: windows-latest
            platform: windows-x64
            wheel_platform: win_amd64
          - os: macos-latest
            platform: macos-universal
            wheel_platform: macosx_11_0_universal2
          - os: ubuntu-latest
            platform: linux-x64
            wheel_platform: manylinux_2_34_x86_64

    env:
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools build ninja

      - name: Setup MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ============================================================================
      # Download Missing Headers
      # ============================================================================
      - name: Download simple_svg header
        run: |
          curl -fsSL -o Vectorize/src_polyvector/simple_svg_1.0.0.hpp \
            https://raw.githubusercontent.com/adishavit/simple-svg/master/simple_svg_1.0.0.hpp
          echo "Downloaded simple_svg_1.0.0.hpp"
        shell: bash

      # ============================================================================
      # Install Dependencies
      # ============================================================================
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev libeigen3-dev libboost-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake opencv eigen boost
          
          # Verify OpenCV cmake config
          BREW_PREFIX=$(brew --prefix)
          OPENCV_CMAKE="${BREW_PREFIX}/opt/opencv/lib/cmake/opencv4"
          echo "Homebrew prefix: $BREW_PREFIX"
          echo "OpenCV cmake: $OPENCV_CMAKE"
          if [ -d "$OPENCV_CMAKE" ]; then
            echo "OpenCV CMake config found"
          else
            echo "OpenCV CMake config NOT found"
            find "$(brew --prefix)" -name "OpenCVConfig.cmake" 2>/dev/null || echo "Not found anywhere"
            exit 1
          fi

      - name: Install OpenCV + Eigen + Boost (Windows)
        if: runner.os == 'Windows'
        run: |
          # OpenCV: official Windows dist is a self-extracting .exe — use 7z to extract
          curl -fsSL -o opencv.exe https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-windows.exe
          7z x opencv.exe -o"$PWD" -y
          echo "OPENCV_ROOT=$PWD/opencv" >> $GITHUB_ENV
          echo "OpenCV extracted to $PWD/opencv"
          ls -la opencv/build/ | head -5

          # Eigen: header-only, download from GitLab
          curl -fsSL -o eigen.tar.gz https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar xzf eigen.tar.gz
          echo "EIGEN3_ROOT=$PWD/eigen-3.4.0" >> $GITHUB_ENV
          echo "Eigen3 downloaded to $PWD/eigen-3.4.0"

          # Boost: header-only graph library, download full source
          curl -fsSL -o boost.tar.gz https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz
          tar xzf boost.tar.gz
          echo "BOOST_ROOT=$PWD/boost_1_86_0" >> $GITHUB_ENV
          echo "Boost downloaded to $PWD/boost_1_86_0"
        shell: bash

      # ============================================================================
      # Build Module
      # ============================================================================
      - name: Configure CMake
        run: |
          mkdir -p Vectorize/build
          cd Vectorize/build
          
          EXTRA_FLAGS=""
          
          if [ "$RUNNER_OS" == "Windows" ]; then
            # OpenCV: pre-built binary layout — cmake config is at opencv/build/
            OPENCV_DIR="${OPENCV_ROOT}/build"
            # Boost: header-only, CMake FindBoost searches CMAKE_PREFIX_PATH for boost/ headers
            EXTRA_FLAGS="-DOpenCV_DIR=${OPENCV_DIR} -DCMAKE_PREFIX_PATH=${EIGEN3_ROOT};${BOOST_ROOT}"
            
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # macOS: Homebrew packages need explicit paths
            BREW_PREFIX=$(brew --prefix)
            OPENCV_CMAKE="${BREW_PREFIX}/opt/opencv/lib/cmake/opencv4"
            EXTRA_FLAGS="-DCMAKE_PREFIX_PATH=${BREW_PREFIX} -DOpenCV_DIR=${OPENCV_CMAKE}"
            
          else
            # Linux: system paths work automatically
            EXTRA_FLAGS=""
          fi
          
          cmake .. -DCMAKE_BUILD_TYPE=Release $EXTRA_FLAGS
        shell: bash

      - name: Build C++ module
        run: |
          cd Vectorize/build
          cmake --build . --verbose
          echo "=== LineVector build completed ==="
          find . -name "*.pyd" -o -name "*.so" || echo "No extensions found"
        shell: bash

      # ============================================================================
      # Build Wheel
      # ============================================================================
      - name: Build wheel
        run: |
          python setup_vectorize.py bdist_wheel

      - name: Bundle dependencies into wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install delvewheel
          cd dist
          original_wheel=$(ls *.whl)
          echo "Repairing wheel: $original_wheel"
          delvewheel repair "$original_wheel" -w repaired --add-path "${OPENCV_ROOT}/build/x64/vc16/bin"
          rm "$original_wheel"
          mv repaired/*.whl .
          echo "Final wheel:"
          ls -la

      - name: Bundle dependencies into wheel (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pip install delocate
          cd dist
          original_wheel=$(ls *.whl)
          echo "Repairing wheel: $original_wheel"
          
          mkdir -p repaired
          delocate-wheel -w repaired -v "$original_wheel" || {
            echo "delocate failed, trying without arch check..."
            delocate-wheel -w repaired -v "$original_wheel"
          }
          
          rm "$original_wheel"
          mv repaired/*.whl .
          echo "Final wheel:"
          ls -la

      - name: Bundle dependencies into wheel (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install auditwheel
          cd dist
          original_wheel=$(ls *.whl)
          echo "Repairing wheel: $original_wheel"
          
          mkdir -p repaired
          auditwheel repair "$original_wheel" -w repaired
          
          rm "$original_wheel"
          mv repaired/*.whl .
          echo "Final wheel:"
          ls -la

      # ============================================================================
      # Test Wheel
      # ============================================================================
      - name: Test wheel installation
        shell: bash
        if: runner.os != 'Windows'
        run: |
          pip install dist/*.whl
          python -c "import gp_linevector; print(f'LineVector v{gp_linevector.__version__} imported successfully')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linevector-${{ matrix.platform }}-${{ matrix.python-version }}
          path: dist/*.whl

  package:
    name: Package Extension
    needs: [build_interpolate, build_linevector]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels-temp
          pattern: wheel-*

      - name: Extract Version
        id: extract_version
        shell: bash
        run: |
          VERSION=$(grep -E '^version\s*=' Addon/blender_manifest.toml | cut -d'"' -f2)
          echo "addon_version=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Create platform-specific packages
        run: |
          # Helper function for dynamic manifest generation
          generate_manifest() {
            local _platform=$1
            local _dir=$2
            echo "platforms = [\"$_platform\"]" >> "$_dir/blender_manifest.toml"
            echo 'wheels = [' >> "$_dir/blender_manifest.toml"
            local _first=true
            for w in "$_dir/wheels/"*.whl; do
              if [ "$_first" = true ]; then
                _first=false
              else
                echo ',' >> "$_dir/blender_manifest.toml"
              fi
              echo -n "  \"./wheels/$(basename "$w")\"" >> "$_dir/blender_manifest.toml"
            done
            echo '' >> "$_dir/blender_manifest.toml"
            echo ']' >> "$_dir/blender_manifest.toml"
            echo '[permissions]' >> "$_dir/blender_manifest.toml"
          }
          
          # Windows
          echo "Creating Windows package..."
          mkdir -p build_windows/Addon
          cp -r Addon/* build_windows/Addon/
          rm -rf build_windows/Addon/wheels
          mkdir -p build_windows/Addon/wheels
          find wheels-temp -name "*win_amd64.whl" -exec cp {} build_windows/Addon/wheels/ \;
          
          generate_manifest "windows-x64" "build_windows/Addon"
          cd build_windows/Addon
          zip -r ../../gp_auto_interpolate-${{ env.addon_version }}-windows-x64.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store" -x "AGENTS.md"
          cd ../..
          
          # macOS Universal (ARM64 + x86_64)
          echo "Creating macOS universal package..."
          mkdir -p build_macos/Addon
          cp -r Addon/* build_macos/Addon/
          rm -rf build_macos/Addon/wheels
          mkdir -p build_macos/Addon/wheels
          find wheels-temp -name "*universal2.whl" -exec cp {} build_macos/Addon/wheels/ \;
          
          generate_manifest "macos-arm64\", \"macos-x64" "build_macos/Addon"
          cd build_macos/Addon
          zip -r ../../gp_auto_interpolate-${{ env.addon_version }}-macos-universal.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store" -x "AGENTS.md"
          cd ../..
          
          # Linux
          echo "Creating Linux package..."
          mkdir -p build_linux/Addon
          cp -r Addon/* build_linux/Addon/
          rm -rf build_linux/Addon/wheels
          mkdir -p build_linux/Addon/wheels
          find wheels-temp -name "*manylinux*.whl" -exec cp {} build_linux/Addon/wheels/ \;
          
          generate_manifest "linux-x64" "build_linux/Addon"
          cd build_linux/Addon
          zip -r ../../gp_auto_interpolate-${{ env.addon_version }}-linux-x64.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store" -x "AGENTS.md"
          cd ../..
          
          echo "✅ Platform-specific packages created:"
          ls -lh gp_auto_interpolate-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.addon_version }}-build-${{ github.run_number }}
          name: "GP Auto Interpolate v${{ env.addon_version }}"
          body: |
            🎉 **Wheel-based release with Local_Modern architecture**
            
            ✅ **Zero-friction installation** - Install like any Blender extension
            ✅ **Cross-platform wheels** - Windows, macOS (Apple Silicon), Linux
            ✅ **Optimized interpolation** - C++ with OpenMP parallelization
            ✅ **Line Art Import** - High-performance vectorization (NEW!)
            ✅ **Static linking** - Works across Linux distributions
            
            **Features:**
            - Real-time interpolation with easing curves
            - Arc-based interpolation (Bezier + Spiral)
            - **Line Art Import**: File > Import > Grease Pencil Line Art
            
            **Installation:**
            1. Download the package for your OS
            2. Install in Blender Extensions
            3. Done!
          files: |
            gp_auto_interpolate-${{ env.addon_version }}-windows-x64.zip
            gp_auto_interpolate-${{ env.addon_version }}-macos-universal.zip
            gp_auto_interpolate-${{ env.addon_version }}-linux-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: gp_auto_interpolate-${{ env.addon_version }}-*.zip
