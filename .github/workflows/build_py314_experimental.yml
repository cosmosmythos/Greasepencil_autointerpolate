# EXPERIMENTAL BUILD FOR PYTHON 3.14 (Arch Linux Blender 5.0)
# This is a ONE-TIME build for a specific customer request
# NOT for general distribution - use build.yml for official releases

name: Build Python 3.14 Wheels (EXPERIMENTAL)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-linux-py314:
    name: "Linux x64 - Python 3.14 (EXPERIMENTAL)"
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake python python-pip opencv boost eigen
      
      - name: Verify Python version
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
      
      - name: Install Python build tools
        run: |
          # Arch Linux requires --break-system-packages for system Python
          pip install --break-system-packages --upgrade pip wheel setuptools build
      
      # ============================================================================
      # BUILD GP AUTO-INTERPOLATE
      # ============================================================================
      
      - name: Build gp_autointerpolate wheel
        working-directory: Executable
        run: |
          echo "=== Building gp_autointerpolate for Python 3.14 ==="
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ls -lh output/
      
      - name: Package gp_autointerpolate wheel
        run: |
          # Temporarily modify setup.py for Python 3.14
          sed -i 's/python_requires=">=3.11"/python_requires=">=3.14"/' setup.py
          sed -i 's/"py_limited_api": "cp311"/"py_limited_api": "cp314"/' setup.py
          python -m build --wheel
          ls -lh dist/
      
      - name: Rename gp_autointerpolate wheel for Python 3.14
        run: |
          cd dist
          WHEEL_NAME=$(ls gp_autointerpolate-*.whl)
          # Handle both cp314-abi3 and cp314-cp314 naming
          NEW_NAME=$(echo $WHEEL_NAME | sed 's/cp314-abi3/cp314-cp314/' | sed 's/cp311-abi3/cp314-cp314/')
          NEW_NAME=$(echo $NEW_NAME | sed 's/manylinux_[0-9_]*/linux/')
          mv "$WHEEL_NAME" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"
          ls -lh
      
      - name: Upload gp_autointerpolate wheel
        uses: actions/upload-artifact@v4
        with:
          name: gp_autointerpolate-py314-linux
          path: dist/gp_autointerpolate-*-cp314-cp314-linux_*.whl
          retention-days: 30
      
      # ============================================================================
      # BUILD GP LINEVECTOR
      # ============================================================================
      
      - name: Build gp_linevector wheel
        working-directory: Vectorize
        run: |
          echo "=== Building gp_linevector for Python 3.14 ==="
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ls -lh output/
      
      - name: Package gp_linevector wheel
        run: |
          # Temporarily modify setup_vectorize.py for Python 3.14
          sed -i 's/python_requires=">=3.11"/python_requires=">=3.14"/' setup_vectorize.py
          sed -i 's/"py_limited_api": "cp311"/"py_limited_api": "cp314"/' setup_vectorize.py
          python setup_vectorize.py bdist_wheel
          ls -lh dist/
      
      - name: Rename gp_linevector wheel for Python 3.14
        run: |
          cd dist
          WHEEL_NAME=$(ls gp_linevector-*.whl | tail -1)
          # Handle both cp314-abi3 and cp314-cp314 naming
          NEW_NAME=$(echo $WHEEL_NAME | sed 's/cp314-abi3/cp314-cp314/' | sed 's/cp311-abi3/cp314-cp314/')
          NEW_NAME=$(echo $NEW_NAME | sed 's/manylinux_[0-9_]*/linux/')
          mv "$WHEEL_NAME" "$NEW_NAME"
          echo "Renamed to: $NEW_NAME"
          ls -lh
      
      - name: Upload gp_linevector wheel
        uses: actions/upload-artifact@v4
        with:
          name: gp_linevector-py314-linux
          path: dist/gp_linevector-*-cp314-cp314-linux_*.whl
          retention-days: 30
      
      # ============================================================================
      # BUILD SUMMARY
      # ============================================================================
      
      - name: Build Summary
        run: |
          echo "=== EXPERIMENTAL PYTHON 3.14 BUILD COMPLETE ==="
          echo "Built for: Arch Linux Blender 5.0"
          echo "Python version: $(python --version)"
          echo ""
          echo "Artifacts:"
          ls -lh dist/*.whl
          echo ""
          echo "⚠️  WARNING: These wheels are EXPERIMENTAL and UNSUPPORTED"
          echo "⚠️  For official releases, use blender.org Blender with build.yml wheels"
